# Niello user templates
# Templates synced from skel to user home directory.
# noctalia-greeter uses greeter.toml config instead of CSS templates.
#
# Enabling a template from the niello-managed noctalia-templates clone
# (~/.config/niello/noctalia-templates, cloned at image build time — see
# Containerfile) is just a [theme.templates.user.<id>] block below,
# pointing input_path at the relevant file under that clone. This keeps
# the enable step reproducible across niello rebuilds without needing a
# new Containerfile edit per template.
#
# Master toggle for the built-in/community catalogs — builtin_ids and
# community_ids alone (set via Settings → Templates, landing in the
# GUI-managed settings.toml) don't do anything without this. Does NOT
# affect [theme.templates.user.*] below, which enable independently
# per the docs.
#
# IMPORTANT: leave niri/gtk3/gtk4 OFF in Settings → Templates (i.e. out
# of builtin_ids). The official built-in GTK templates require
# switching the GTK theme to adw-gtk3 (Niello ships Adwaita-dark) and
# write to a different file (noctalia.css, imported into gtk.css via a
# post_hook) than the direct @define-color approach our gtk3-theme/
# gtk4-theme user templates use below — running both writes conflicting
# content to the same file. The built-in niri template's actual output
# is also unconfirmed against our niri-colors template below. Safe to
# revisit if/when Niello switches to adw-gtk3.
[theme.templates]
enable_builtin_templates   = true
enable_community_templates = true

# AKSprayPaint — writes the active theme's colors to
# ~/.config/noctalia/colors.json in AKSprayPaint's flat native format,
# for every palette source (custom, community, builtin, wallpaper) alike.
# Always enabled so colors.json exists by default, whether or not
# AKSprayPaint itself is installed yet — AKSprayPaint's own inotify
# watch picks it up the moment it's downloaded, no reconfiguration
# needed.
[theme.templates.user.akspraypaint]
input_path  = "$XDG_CONFIG_HOME/niello/noctalia-templates/akspraypaint/akspraypaint-colors.json"
output_path = "$XDG_CONFIG_HOME/noctalia/colors.json"

# Niri window outline colors — focus-ring + border active/inactive/
# urgent colors synced to the active palette. niri live-reloads on
# save, no post_hook needed. Requires config.kdl to
# `include "./noctalia-colors.kdl"` — see config/niri/config.kdl.
[theme.templates.user.niri-colors]
input_path  = "$XDG_CONFIG_HOME/niello/noctalia-templates/niri-colors/niri-colors.kdl"
output_path = "$XDG_CONFIG_HOME/niri/noctalia-colors.kdl"

# GTK3 accent colors — via @define-color overrides in gtk.css, the
# mechanism Adwaita actually reads (unlike the legacy gtk-color-scheme
# ini key). Picked up by GTK3 apps like Nemo on next launch.
[theme.templates.user.gtk3-theme]
input_path  = "$XDG_CONFIG_HOME/niello/noctalia-templates/gtk3-theme/gtk.css"
output_path = "$XDG_CONFIG_HOME/gtk-3.0/gtk.css"

# GTK4 accent colors — libadwaita's named colors, same idea as above.
[theme.templates.user.gtk4-theme]
input_path  = "$XDG_CONFIG_HOME/niello/noctalia-templates/gtk4-theme/gtk.css"
output_path = "$XDG_CONFIG_HOME/gtk-4.0/gtk.css"
